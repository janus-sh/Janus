name: Bug report
description: Something broke or behaved wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The error text, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: ran
    attributes:
      label: What you ran
      description: The command or the task you gave Janus.
      render: sh
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `janus doctor`
      description: Version, system, which services have a key and answer, the model list in use. It never prints a key.
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Routing log
      description: For "wrong model" or "no free model" problems, run with `JANUS_DEBUG=1` and paste the end of `~/.janus/agent/janus-debug.log`. It has model names and errors, no keys.
      render: text
